spring:
  application:
    name: leadorbit
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:leadorbit}
    username: ${DB_USERNAME:leadorbit}
    password: ${DB_PASSWORD:leadorbit}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      connection-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:12MB}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

server:
  port: ${PORT:8080}
  servlet:
    context-path: ${API_PREFIX:/api/v1}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      access-secret: ${JWT_ACCESS_SECRET:change-me-access-secret-please-override-in-env-1234567890}
      access-expiry: ${JWT_ACCESS_EXPIRY:PT15M}
      refresh-secret: ${JWT_REFRESH_SECRET:change-me-refresh-secret-please-override-in-env-1234567890}
      refresh-expiry: ${JWT_REFRESH_EXPIRY:P7D}
  auth:
    reset-link-base: ${RESET_LINK_BASE:http://localhost:5173}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    bootstrap:
      super-admin:
        email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
        password: ${BOOTSTRAP_ADMIN_PASSWORD:}
        name: ${BOOTSTRAP_ADMIN_NAME:System Administrator}
  storage:
    local:
      base-path: ${STORAGE_BASE_PATH:./uploads}
  billing:
    zone-id: ${BILLING_ZONE_ID:Asia/Kolkata}
    default-gst-rate: ${BILLING_DEFAULT_GST_RATE:18.00}
    default-due-days: ${BILLING_DEFAULT_DUE_DAYS:15}
    allow-credit-balance: ${BILLING_ALLOW_CREDIT_BALANCE:false}
    proration-policy: ${BILLING_PRORATION_POLICY:NONE}
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
    billing-cron: ${BILLING_CRON:0 0 2 * * *}
  mail:
    enabled: ${MAIL_ENABLED:true}
    dispatcher-delay-ms: ${MAIL_DISPATCHER_DELAY_MS:30000}
  demo:
    enabled: ${DEMO_ENABLED:false}
